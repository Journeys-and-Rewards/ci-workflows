name: Secret Scan

# Blocks any commit/PR that introduces a credential (API key, token, private
# key, etc.) into the engine repo. Scans the full git history, not just the
# latest change, so a secret can never slip in via an earlier commit.

# REUSABLE. Called by a 3-line stub in each project repository; the logic lives only here, so a
# change reaches every project at once and no project can drift from it by editing a copy.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # Pinned to match the version baked into the engine Dockerfile.
          GITLEAKS_VERSION=8.18.4
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks detect (all history)
        # -v prints each finding (file, line, commit, rule) with the secret value
        # REDACTED — a failing scan that hides WHERE the leak is cannot be acted on.
        run: gitleaks detect --no-banner --source . --redact -v --log-opts="--all"

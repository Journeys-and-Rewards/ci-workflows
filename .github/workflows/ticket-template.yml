name: Ticket Template Policy

# REUSABLE. Called by a 3-line stub in each project repository.
#
# WHAT THIS CHECKS, and why it is a separate implementation. GitHub only runs a workflow that
# physically lives in the repository being checked, so these checks must be centralised here. The
# engine's own validators cannot be: their measured transitive closure is 18 files and ~10,300 lines,
# reaching its internal common library and through it the model-routing policy, role execution and the
# notification channel. None of that belongs in public, and none of it is needed to check the shape of
# a project's tickets and project state.
#
# So lib/ci_policy.py implements exactly the rules a project needs, in pure Python with no engine
# dependency. The engine holds an equivalence suite that runs BOTH implementations over the same inputs
# and fails if their verdicts ever diverge, so this is a second implementation under contract rather
# than a fork.
#
# THE CONTRACT COMES FROM THE CALLING PROJECT. This repository supplies validation CODE only. The
# canonical project-state template is read from the caller's own
# docs/templates/project-state.template.md, which the engine scaffolds into every project it creates.
# If that file is missing the check FAILS and says how to restore it — it is never substituted, because
# a project judged against somebody else's contract has not been judged at all.
#
# This job is the status context a project's branch protection requires, so project-state conformance
# blocks a merge here exactly as it does in the engine's own required check.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ticket-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE POLICY COMPONENT'S LOCATION IS WRITTEN HERE, and that is deliberate: this file and the ref
      # below are committed and tagged together, so the validator a project runs is always the code that
      # shipped beside the workflow calling it. A release bumps both in one commit.
      #
      # Two earlier attempts are worth recording, because each failed in a way that was invisible from
      # the caller's side:
      #   · deriving it from github.workflow_ref — inside a CALLED workflow that reports the CALLER's
      #     path, so the step checked out the calling project and the validator was not there to run
      #     (observed as "…/t11-ac1d-smoke/.github/workflows/ticket-template.yml@refs/pull/1/merge");
      #   · declaring workflow_call inputs with defaults — the call then failed to start at all, with
      #     the run reported under the file's path instead of its name and no job, no log and no
      #     annotation to explain it.
      - name: Check out the policy component
        uses: actions/checkout@v4
        with:
          repository: Journeys-and-Rewards/ci-workflows
          ref: v1.0.2
          path: .policy

      - name: Report which policy component is in use
        run: echo "policy component: Journeys-and-Rewards/ci-workflows@v1.0.2"

      - name: Ticket specifications follow the standard template
        run: |
          set -euo pipefail
          python3 .policy/lib/ci_policy.py --root . --only tickets

      - name: Project state conformance
        run: |
          set -euo pipefail
          # The contract is the CALLER's own template. Nothing is substituted if it is absent: the
          # validator fails closed and names the remedy.
          python3 .policy/lib/ci_policy.py --root . --only project-state

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Ticket Template Policy Failed"
            echo ""
            echo "The step log above names each problem, prefixed with the rule that found it."
            echo ""
            echo "- \`TT-SECTIONS\` / \`TT-USER-ACTIONED\` — a ticket page under \`docs/tickets/\` does not"
            echo "  follow the standard template for its kind."
            echo "- \`PS-SECTIONS\` / \`PS-STANDARD\` / \`PS-PLACEHOLDER\` / \`PS-INSTRUCTIONS\` —"
            echo "  \`docs/project_state.md\` does not match your project's"
            echo "  \`docs/templates/project-state.template.md\`."
            echo "- \`PS-MEMBERSHIP\` — the roadmap registry and \`docs/tickets/\` do not describe the same"
            echo "  tickets. Add or remove both halves in the same change."
            echo "- \`PS-NEXT\` — zero or several tickets are marked \`**NEXT**\`; exactly one may be."
          } >> "$GITHUB_STEP_SUMMARY"
